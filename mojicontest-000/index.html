<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>諱文字コンテスト</title>
<style>
  body{margin:0;background:#101216;color:#e8eaf0;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
  main{max-width:800px;margin:0 auto;padding:32px 16px}
  a{color:#c9a86a}
</style>
</head>
<body>
<main>
  <p id="msg">ページへ移動します…</p>
  <p>
    自動で移動しない場合は、こちらから開いてください：
    <a href="guess/">予想リスト</a> ／ <a href="answer/">答え合わせ</a>
  </p>
</main>
<script src="config.js"></script>
<script>
  (function () {
    var cfg = window.SITE_CONFIG || {};
    var wave = cfg.wave === "answer" ? "answer" : "guess";
    if (cfg.eventName) {
      document.title = cfg.eventName;
      document.getElementById("msg").textContent = cfg.eventName + " のページへ移動します…";
    }
    location.replace(wave + "/" + location.search + location.hash);
  })();
</script>
</body>
</html>
