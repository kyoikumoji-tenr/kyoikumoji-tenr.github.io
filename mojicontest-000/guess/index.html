<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>諱文字コンテスト</title>
<style>
  @font-face{
    font-family:"GenZenGothicKai";
    src:url("../../assets/fonts/GenZenGothicKai.ttf") format("truetype");
    font-weight:400 900;
    font-display:swap;
  }
  :root{
    --bg:#12100d; --surface:#1c1a16; --surface-2:#2a2721;
    --ink:#f5f2ea; --muted:#a79d8d; --line:#35302a;
    --accent:#f5f2ea; --accent-soft:#2e2a24; --accent-ink:#12100d;
    --media-bg:#26231e;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    --cols:3;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"GenZenGothicKai","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;line-height:1.6;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button,select,input{min-height:2.25rem}
  a{color:var(--accent)}
  .wrap{max-width:1440px;margin:0 auto;padding:0 16px 64px}
  /* ---- 見出し ---- */
  .intro{padding:30px 0 6px;background:radial-gradient(640px 230px at 12% 0, rgba(245,242,234,.09), rgba(245,242,234,0) 70%)}
  .intro h1{
    font-weight:900;font-size:clamp(26px,4.5vw,38px);
    letter-spacing:.04em;margin:0 0 8px;line-height:1.35;
  }
  .intro h1 .accent{color:var(--accent)}
  .intro p{margin:0;max-width:46em;color:var(--muted)}
  /* ---- ツールバー ---- */
  .toolbar{
    position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);padding:12px 0 10px;margin-top:14px;
  }
  .tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .search-box{position:relative;flex:1 1 200px;max-width:340px}
  .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--muted);pointer-events:none}
  .search-box input{
    width:100%;padding:8px 12px 8px 34px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);
  }
  .search-box input::placeholder{color:var(--muted)}
  .search-box input:focus{outline:2px solid var(--accent);border-color:transparent}
  .filter-box select{
    border:1px solid var(--line);border-radius:8px;background:var(--surface);
    padding:7px 10px;cursor:pointer;
  }
  .cols-ctl{display:flex;align-items:center;gap:6px}
  .cols-ctl .lbl{font-size:13px;color:var(--muted);font-weight:700}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:var(--surface)}
  .seg button{
    border:0;background:transparent;padding:6px 0;width:40px;min-height:2.25rem;
    font-weight:700;cursor:pointer;color:var(--muted);
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .spacer{flex:1}
  .count-note{font-size:13px;color:var(--muted);font-weight:700}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;
    min-height:2.5rem;text-decoration:none;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn[disabled]{opacity:.45;cursor:default;transform:none}
  .progress-bar{height:6px;background:var(--surface-2);border-radius:999px;
    overflow:hidden;margin-top:10px}
  .progress-bar i{display:block;height:100%;width:0;background:var(--accent);
    border-radius:999px;transition:width .3s ease}
  /* ---- カード ---- */
  .grid{
    display:grid;gap:14px;margin-top:18px;
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .card.done{border-color:var(--accent)}
  .card{transition:transform .16s ease, box-shadow .16s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.5), 0 16px 36px rgba(0,0,0,.55)}
  .media{
    position:relative;display:block;width:100%;aspect-ratio:1/1;
    background:var(--media-bg);border:0;padding:0;cursor:zoom-in;overflow:hidden;
  }
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{
    position:absolute;top:8px;left:8px;background:rgba(18,16,13,.62);color:#fff;
    font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;
  }
  .card-body{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .no-tag{
    font-weight:900;font-size:15px;letter-spacing:.03em;
    border:1.5px solid var(--accent);color:var(--accent);
    border-radius:6px;padding:1px 8px;line-height:1.5;white-space:nowrap;
  }
  .card.done .no-tag{background:var(--accent);color:var(--accent-ink)}
  .work-title{
    font-weight:900;letter-spacing:.06em;line-height:1.3;
    font-size:clamp(24px,2.6vw,32px);margin:2px 0;overflow-wrap:anywhere;
  }
  body[data-cols="5"] .work-title,body[data-cols="6"] .work-title{font-size:20px}
  .work-title .t-lbl{
    display:block;font-size:11px;font-weight:700;color:var(--muted);
    letter-spacing:.14em;margin-bottom:1px;
  }
  .author-line{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:9px;margin-top:2px;
  }
  .author-line .a-lbl{font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.1em;white-space:nowrap}
  .author-line .a-name{font-size:18px;font-weight:900;letter-spacing:.02em;
    line-height:1.4;overflow-wrap:anywhere}
  body[data-cols="5"] .author-line .a-name,
  body[data-cols="6"] .author-line .a-name{font-size:15.5px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field span{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
  .field input,.field textarea,.field select{
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:.95rem;width:100%;
  }
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .field textarea{resize:vertical;min-height:2.4em}
  .empty{text-align:center;color:var(--muted);padding:56px 16px;font-weight:700}
  footer{color:var(--muted);font-size:.8rem;padding:22px 0 0}
  /* ---- オーバーレイ（拡大表示・書き出し） ---- */
  .overlay{
    position:fixed;inset:0;z-index:80;background:rgba(5,4,3,.78);
    display:none;align-items:flex-start;justify-content:center;
    overflow-y:auto;padding:20px 12px;
  }
  .overlay.open{display:flex}
  .sheet{
    background:var(--surface);border-radius:14px;width:100%;max-width:680px;
    padding:20px;box-shadow:var(--shadow);margin:auto 0;
  }
  .sheet h2{margin:0 0 4px;font-size:19px;font-weight:900}
  .sheet .close-x{
    float:right;border:0;background:var(--surface-2);border-radius:8px;
    width:40px;height:40px;font-size:18px;cursor:pointer;line-height:1;color:var(--ink);
  }
  .lb-media{border-radius:10px;overflow:hidden;background:var(--media-bg);
    aspect-ratio:1/1;position:relative;margin-bottom:6px}
  .lb-media img,.lb-media video{width:100%;height:100%;object-fit:contain;display:block}
  .lb-title-big{
    font-weight:900;font-size:clamp(30px,6vw,42px);letter-spacing:.06em;
    line-height:1.3;margin:8px 0 10px;overflow-wrap:anywhere;
  }
  .lb-title-big .t-lbl{
    display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em;
  }
  .lb-author{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:12px;margin-top:4px;
  }
  .lb-author .a-lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
  .lb-author .a-name{font-size:24px;font-weight:900;line-height:1.4;overflow-wrap:anywhere}
  .sheet .field{margin-top:12px}
  .note{font-size:.88rem;color:var(--muted);margin-top:10px}
  #exp-preview{max-width:100%;margin-top:12px;display:none;
    border:1px solid var(--line);border-radius:8px}
  #exp-download{display:none;margin-top:12px}
  @media (max-width:640px){
    .wrap{padding:0 10px 56px}
    .grid{gap:10px}
    .card-body{padding:8px 9px 11px}
    .btn{padding:7px 11px;font-size:13.5px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h1 id="site-title"></h1>
    <p id="site-desc"></p>
  </header>

  <div class="toolbar">
    <div class="tb-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/>
        </svg>
        <input type="search" id="q" placeholder="題字で検索" aria-label="検索">
      </div>
      <label class="filter-box" id="filter-wrap">
        <select id="filter" aria-label="表示">
          <option value="all">すべて</option>
          <option value="done">予想済み</option>
          <option value="todo">未入力</option>
        </select>
      </label>
      <div class="cols-ctl">
        <span class="lbl">列数</span>
        <div class="seg" id="cols-seg" role="group" aria-label="列数">
          <button type="button" data-c="2">2</button>
          <button type="button" data-c="3">3</button>
          <button type="button" data-c="4">4</button>
          <button type="button" data-c="5">5</button>
          <button type="button" data-c="6">6</button>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="count-note" id="progress"></span>
      <button type="button" class="btn primary" id="export-btn">予想を画像で書き出す</button>
    </div>
    <div class="progress-bar" id="progress-bar-wrap"><i id="progress-bar"></i></div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>該当する作品がありません。</p>
  </main>
  <footer>入力した予想は、この端末のブラウザにだけ保存されます。</footer>
</div>

<!-- 拡大表示 -->
<div class="overlay" id="lightbox" role="dialog" aria-modal="true">
  <div class="sheet">
    <button type="button" class="close-x" id="lb-close" aria-label="閉じる">×</button>
    <div class="lb-media" id="lb-media"></div>
    <span class="no-tag" id="lb-no"></span>
    <div class="lb-title-big"><span class="t-lbl">題字</span><span id="lb-title"></span></div>
    <div class="lb-author" id="lb-author">
      <span class="a-lbl">作者</span><span class="a-name" id="lb-author-name"></span>
    </div>
    <div id="lb-fields">
      <div class="field"><span>作者の予想</span><input type="text" id="lb-guess" placeholder="作者名の予想"></div>
      <div class="field"><span>メモ</span><textarea id="lb-memo" placeholder="気づいたことなど"></textarea></div>
    </div>
  </div>
</div>

<!-- 書き出しモーダル -->
<div class="overlay" id="export-modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button type="button" class="close-x" id="exp-close" aria-label="閉じる">×</button>
    <h2>予想を画像で書き出す</h2>
    <div class="field"><span>予想者の名前（画像に入ります）</span>
      <input type="text" id="exp-name" placeholder="すべあな"></div>
    <div class="field"><span>範囲</span>
      <select id="exp-range">
        <option value="all">全件</option>
        <option value="guessed">予想を書いたものだけ</option>
      </select></div>
    <p class="note" id="exp-note"></p>
    <button type="button" class="btn primary" id="exp-generate">画像を生成する</button>
    <img id="exp-preview" alt="書き出し画像のプレビュー">
    <div><a id="exp-download" class="btn" href="#" download="guesses.png">PNGをダウンロード</a></div>
  </div>
</div>

<script src="../config.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const DATA = window.SITE_DATA || { phase: "guess", entries: [] };
const PHASE = DATA.phase === "answer" ? "answer" : "guess";
const ENTRIES = (DATA.entries || []).slice().sort((a, b) => a.no - b.no);
const CONFIG = window.SITE_CONFIG || {};
const EVENT_NAME = CONFIG.eventName || "諱文字コンテスト";
const LS_KEY = "moji_guesses" + location.pathname.replace(/[^a-zA-Z0-9]+/g, "_");

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(3, "0");
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

// ---- 予想の保存（この端末のブラウザ内だけ） ----
let store = { byNo: {}, name: "" };
if (PHASE === "guess") {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) store = Object.assign(store, JSON.parse(raw));
  } catch (e) { /* 保存が読めなくても表示は続ける */ }
}
function saveStore() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
}
function guessOf(no) {
  const g = store.byNo[no] || {};
  return { guess: g.guess || "", memo: g.memo || "" };
}
function setGuess(no, key, value) {
  const g = guessOf(no);
  g[key] = value;
  store.byNo[no] = g;
  saveStore();
}

// ---- 見出し ----
if (PHASE === "answer") {
  document.title = EVENT_NAME + " 答え合わせ";
  $("site-title").innerHTML = esc(EVENT_NAME) + ' <span class="accent">答え合わせ</span>';
  $("site-desc").textContent = "予想期間が終わったので、各作品の作成者を公開します。画像の下に題字と作成者名を表示しています。";
  $("q").placeholder = "題字・作者名で検索";
  $("filter-wrap").style.display = "none";
  $("export-btn").style.display = "none";
  $("progress-bar-wrap").style.display = "none";
  document.querySelector("footer").style.display = "none";
} else {
  document.title = EVENT_NAME + " 予想リスト";
  $("site-title").innerHTML = esc(EVENT_NAME) + ' <span class="accent">予想リスト</span>';
  $("site-desc").textContent = "作品は作者名を伏せた状態で、題字とセットで公開されています。各作品の作者を予想して入力してください。入力はこの端末のブラウザに自動で保存されます。";
}

// ---- 列数（セグメントボタン） ----
let curCols = 3;
function setCols(n) {
  curCols = n;
  document.body.dataset.cols = String(n);
  document.querySelectorAll("#cols-seg button").forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.c) === n));
  });
  render();
}
$("cols-seg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-c]");
  if (b) setCols(Number(b.dataset.c));
});

// ---- 一覧の描画 ----
function thumbSrc(e) { return e.thumb || e.media; }
function matches(e) {
  const q = $("q").value.trim();
  if (q) {
    const hay = PHASE === "answer" ? (e.title + " " + (e.author || "") + " " + pad(e.no))
                                   : (e.title + " " + pad(e.no));
    if (!hay.includes(q)) return false;
  }
  if (PHASE === "guess") {
    const f = $("filter").value;
    const has = guessOf(e.no).guess.trim() !== "";
    if (f === "done" && !has) return false;
    if (f === "todo" && has) return false;
  }
  return true;
}
function updateProgress() {
  if (PHASE !== "guess") { $("progress").textContent = ""; return; }
  const done = ENTRIES.filter((e) => guessOf(e.no).guess.trim() !== "").length;
  $("progress").textContent = "予想済み " + done + " / " + ENTRIES.length + " 件";
  $("progress-bar").style.width = ENTRIES.length ? (done / ENTRIES.length * 100) + "%" : "0%";
}
function render() {
  const grid = $("grid");
  grid.style.setProperty("--cols", curCols);
  document.documentElement.style.setProperty("--cols", curCols);
  grid.innerHTML = "";
  let shown = 0;
  for (const e of ENTRIES) {
    if (!matches(e)) continue;
    shown++;
    const card = document.createElement("article");
    card.className = "card" + (PHASE === "guess" && guessOf(e.no).guess.trim() !== "" ? " done" : "");
    const badge = (e.type === "video") ? '<span class="badge">▶ 動画</span>' : "";
    let body = '<div class="media" data-open="' + e.no + '"><img loading="lazy" src="' +
      esc(thumbSrc(e)) + '" alt="' + esc(e.title) + '">' + badge + "</div>" +
      '<div class="card-body"><div class="card-top"><span class="no-tag">No.' + pad(e.no) + "</span></div>" +
      '<div class="work-title"><span class="t-lbl">題字</span>' + esc(e.title) + "</div>";
    if (PHASE === "answer") {
      body += '<div class="author-line"><span class="a-lbl">作者</span>' +
        '<span class="a-name">' + esc(e.author || "") + "</span></div>";
    } else {
      const g = guessOf(e.no);
      body += '<div class="field"><span>作者の予想</span>' +
        '<input type="text" data-guess="' + e.no + '" value="' + esc(g.guess) + '" placeholder="作者名の予想"></div>' +
        '<div class="field"><span>メモ</span>' +
        '<textarea data-memo="' + e.no + '" placeholder="気づいたことなど">' + esc(g.memo) + "</textarea></div>";
    }
    body += "</div>";
    card.innerHTML = body;
    grid.appendChild(card);
  }
  $("empty").hidden = shown !== 0;
  updateProgress();
}
$("grid").addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.guess) {
    setGuess(Number(t.dataset.guess), "guess", t.value);
    const card = t.closest(".card");
    if (card) card.classList.toggle("done", t.value.trim() !== "");
    updateProgress();
  }
  if (t.dataset.memo) setGuess(Number(t.dataset.memo), "memo", t.value);
});
$("grid").addEventListener("click", (ev) => {
  const th = ev.target.closest("[data-open]");
  if (th) openLightbox(Number(th.dataset.open));
});
$("q").addEventListener("input", render);
$("filter").addEventListener("change", render);

// ---- 拡大表示 ----
let lbNo = null;
function openLightbox(no) {
  const e = ENTRIES.find((x) => x.no === no);
  if (!e) return;
  lbNo = no;
  $("lb-no").textContent = "No." + pad(e.no);
  $("lb-title").textContent = e.title;
  const media = $("lb-media");
  if (e.type === "video") {
    media.innerHTML = '<video controls playsinline src="' + esc(e.media) + '"></video>';
  } else {
    media.innerHTML = '<img src="' + esc(e.media) + '" alt="' + esc(e.title) + '">';
  }
  if (PHASE === "answer") {
    $("lb-author-name").textContent = e.author || "";
    $("lb-author").style.display = "";
    $("lb-fields").style.display = "none";
  } else {
    $("lb-author").style.display = "none";
    $("lb-fields").style.display = "";
    const g = guessOf(no);
    $("lb-guess").value = g.guess;
    $("lb-memo").value = g.memo;
  }
  $("lightbox").classList.add("open");
}
function closeLightbox() { $("lightbox").classList.remove("open"); lbNo = null; }
$("lb-close").addEventListener("click", closeLightbox);
$("lightbox").addEventListener("click", (ev) => { if (ev.target === $("lightbox")) closeLightbox(); });
$("lb-guess").addEventListener("input", (ev) => { if (lbNo != null) { setGuess(lbNo, "guess", ev.target.value); render(); } });
$("lb-memo").addEventListener("input", (ev) => { if (lbNo != null) { setGuess(lbNo, "memo", ev.target.value); render(); } });

// ---- PNG書き出し（予想パートのみ） ----
// レイアウト: 対象件数 N に対し 行数 R = floor(√N)（N が n^2〜(n+1)^2−1 のとき n 行）、
// 列数 C = ceil(N / R)。ただし C が 10 を超える場合だけ C = 10, R = ceil(N / 10)。
function exportLayout(n) {
  if (n <= 0) return { cols: 0, rows: 0 };
  let rows = Math.floor(Math.sqrt(n));
  if (rows < 1) rows = 1;
  let cols = Math.ceil(n / rows);
  if (cols > 10) { cols = 10; rows = Math.ceil(n / cols); }
  return { cols, rows };
}
function exportTargets() {
  if ($("exp-range").value === "guessed") {
    return ENTRIES.filter((e) => guessOf(e.no).guess.trim() !== "");
  }
  return ENTRIES.slice();
}
function updateExpNote() {
  const list = exportTargets();
  const { cols, rows } = exportLayout(list.length);
  if (list.length === 0) {
    $("exp-note").textContent = "対象がありません。";
    $("exp-generate").disabled = true;
  } else {
    $("exp-note").textContent = "対象" + list.length + "件 → " + cols + "列 × " + rows + "行で書き出します";
    $("exp-generate").disabled = false;
  }
}
function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
async function generateExport() {
  const list = exportTargets();
  if (list.length === 0) return;
  try { await document.fonts.ready; } catch (e) {}
  const { cols } = exportLayout(list.length);
  const name = $("exp-name").value.trim();
  store.name = name; saveStore();
  const CELL_W = 380, GAP = 16, PAD = 24, HEAD = 118;
  const IMG_H = CELL_W, TXT_H = 118, CELL_H = IMG_H + TXT_H;
  const rows = Math.ceil(list.length / cols);
  const W = PAD * 2 + cols * CELL_W + (cols - 1) * GAP;
  const H = HEAD + rows * CELL_H + (rows - 1) * GAP + PAD;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#12100d"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#f5f2ea";
  ctx.font = "900 44px 'GenZenGothicKai','Noto Sans JP',sans-serif";
  ctx.textBaseline = "top";
  ctx.fillText(EVENT_NAME + " 予想リスト", PAD, 30);
  ctx.font = "28px 'GenZenGothicKai','Noto Sans JP',sans-serif";
  ctx.fillStyle = "#a79d8d";
  ctx.fillText(name ? "予想者：" + name : "予想者：", PAD, 84);
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    const cx = PAD + (i % cols) * (CELL_W + GAP);
    const cy = HEAD + Math.floor(i / cols) * (CELL_H + GAP);
    ctx.fillStyle = "#1c1a16";
    roundRect(ctx, cx, cy, CELL_W, CELL_H, 12); ctx.fill();
    ctx.strokeStyle = "#35302a"; ctx.lineWidth = 2;
    roundRect(ctx, cx, cy, CELL_W, CELL_H, 12); ctx.stroke();
    try {
      const img = await loadImg(thumbSrc(e));
      const scale = Math.max(CELL_W / img.width, IMG_H / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.save();
      roundRect(ctx, cx, cy, CELL_W, IMG_H, 12); ctx.clip();
      ctx.drawImage(img, cx + (CELL_W - dw) / 2, cy + (IMG_H - dh) / 2, dw, dh);
      ctx.restore();
      if (e.type === "video") {
        ctx.fillStyle = "rgba(18,16,13,.62)";
        roundRect(ctx, cx + 10, cy + 10, 92, 34, 17); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "700 22px 'GenZenGothicKai',sans-serif";
        ctx.fillText("▶ 動画", cx + 22, cy + 16);
      }
    } catch (err) {
      ctx.fillStyle = "#26231e"; ctx.fillRect(cx, cy, CELL_W, IMG_H);
    }
    ctx.fillStyle = "#f5f2ea"; ctx.font = "900 24px 'GenZenGothicKai',sans-serif";
    ctx.fillText("No." + pad(e.no), cx + 14, cy + IMG_H + 10);
    ctx.fillStyle = "#f5f2ea"; ctx.font = "900 34px 'GenZenGothicKai','Noto Sans JP',sans-serif";
    ctx.fillText(e.title, cx + 14, cy + IMG_H + 40);
    const g = guessOf(e.no).guess.trim();
    ctx.font = "26px 'GenZenGothicKai','Noto Sans JP',sans-serif";
    ctx.fillStyle = g ? "#f5f2ea" : "#a79d8d";
    ctx.fillText("予想：" + (g || "（未入力）"), cx + 14, cy + IMG_H + 82);
  }
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const prev = $("exp-preview");
    prev.src = url; prev.style.display = "block";
    const dl = $("exp-download");
    dl.href = url; dl.style.display = "inline-flex";
  }, "image/png");
}
if (PHASE === "guess") {
  $("exp-name").value = store.name || "";
  $("export-btn").addEventListener("click", () => {
    $("exp-name").value = store.name || "";
    updateExpNote();
    $("export-modal").classList.add("open");
  });
  $("exp-close").addEventListener("click", () => $("export-modal").classList.remove("open"));
  $("export-modal").addEventListener("click", (ev) => { if (ev.target === $("export-modal")) $("export-modal").classList.remove("open"); });
  $("exp-range").addEventListener("change", updateExpNote);
  $("exp-generate").addEventListener("click", generateExport);
}

setCols(3);
render();
</script>
</body>
