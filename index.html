<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント一覧 | kyoikumoji-tenr</title>
<style>
  @font-face{
    font-family:"GenZenGothicKai";
    src:url("assets/fonts/GenZenGothicKai.ttf") format("truetype");
    font-weight:400 900;
    font-display:swap;
  }
  :root{
    --bg:#12100d; --surface:#1c1a16; --ink:#f5f2ea; --muted:#a79d8d;
    --line:#35302a; --accent:#e85a33;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  }
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"GenZenGothicKai","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
  main{max-width:800px;margin:0 auto;padding:32px 16px}
  h1{font-size:1.5rem;font-weight:900;margin:0 0 20px;letter-spacing:.03em}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  a{display:block;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);
    padding:14px 16px;color:var(--ink);text-decoration:none}
  a:hover{border-color:var(--accent)}
  .name{font-weight:900}
  .path{color:var(--muted);font-size:.85rem;margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>イベント一覧</h1>
  <ul>
    <li><a href="mojicontest-000/">
      <div class="name">諱文字コンテスト（テスト）</div>
      <div class="path">mojicontest-000</div>
    </a></li>
  </ul>
</main>
</body>
</html>
